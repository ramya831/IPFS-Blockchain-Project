<!DOCTYPE html>
<html>
<head>
    <title>Blockchain Transaction System</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
        }

        /* Header */
        .header {
            background-color: #2c3e50;
            color: white;
            padding: 15px 30px;
            font-size: 22px;
            font-weight: bold;
        }

        /* Layout */
        .container {
            display: flex;
        }

        /* Sidebar */
        .sidebar {
            width: 240px;
            background-color: #34495e;
            min-height: 100vh;
            padding-top: 20px;
        }

        .sidebar h3 {
            color: #ecf0f1;
            text-align: center;
            margin-bottom: 20px;
        }

        .sidebar a {
            display: block;
            color: #ecf0f1;
            padding: 12px 20px;
            text-decoration: none;
            font-size: 15px;
        }

        .sidebar a:hover {
            background-color: #1abc9c;
        }

        /* Main content */
        .content {
            flex: 1;
            padding: 30px;
        }

        .welcome {
            background-color: white;
            padding: 20px;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: white;
            padding: 20px;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
        }

        .card a {
            text-decoration: none;
            color: #2c3e50;
            font-weight: bold;
        }

        .card a:hover {
            color: #1abc9c;
        }
    </style>
</head>
<body>

<div class="header">
    Blockchain Transaction System
</div>

<div class="container">

    <!-- Sidebar -->
    <div class="sidebar">
        <h3>Menu</h3>
        <a href="{% url 'view_shared_messages' %}">View Shared Messages</a>
        <a href="{% url 'graph' %}">Storage Overhead Graph</a>
        <a href="{% url 'logout' %}">Logout</a>
    </div>

    <!-- Main Content -->
    <div class="content">
        <div class="welcome">
            <h2>Welcome {{ request.user.username }}</h2>
            <p>This dashboard allows secure blockchain-based data sharing using IPFS.</p>
        </div>

        
            
            <div class="card">
                <a href="{% url 'view_shared_messages' %}">📄 view_transaction</a>
            </div>
        </div>
