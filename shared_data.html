<!DOCTYPE html>
<html>
<head>
    <title>Share Secured Data</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
        }
        .box {
            width: 500px;
            margin: 50px auto;
            background: white;
            padding: 20px;
            border-radius: 6px;
        }
        input, select, button {
            width: 100%;
            padding: 8px;
            margin-top: 10px;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Share Secured Data</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <label>Enter Message</label>
        <input type="text" name="message" required>

        <label>Choose File</label>
        <input type="file" name="file" required>

        <label>Choose Shared User</label>
        <select name="shared_user" required>
            <option value="">-- Select User --</option>
            {% for user in users %}
                <option value="{{ user.id }}">{{ user.username }}</option>
            {% empty %}
                <option>No users found</option>
            {% endfor %}
        </select>

        <button type="submit">Share Data</button>
    </form>
</div>

</body>
</html>
