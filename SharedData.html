<!DOCTYPE html>
<html>
<head>
    <title>Share Secure Data</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }
        .box {
            width: 400px;
            margin: 100px auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 0 10px #ccc;
        }
        h2 {
            text-align: center;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <select name="shared_user">
        {% for user in users %}
            <option value="{{ user.id }}">{{ user.username }}</option>
        {% endfor %}
    </select>

    <textarea name="message"></textarea>

    <input type="file" name="file">

    <input type="text" name="ipfs_hash">

    <button type="submit">Save</button>
</form>

<div class="box">
    <h3>IPFS File Hash</h3>

    {% if ipfs_hash %}
        <p>{{ ipfs_hash }}</p>
        <a href="http://127.0.0.1:8000/ipfs/{{ ipfs_hash }}" target="_blank">View File</a>
    {% else %}
        <p>No file uploaded yet.</p>
    {% endif %}


    {% if message %}
        <p style="color: green; text-align:center;">{{ message }}</p>
    {% endif %}

    {% if error %}
        <p style="color: red; text-align:center;">{{ error }}</p>
    {% endif %}
</div>

</body>
</html>
